name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # the two platforms the product is built and shipped for (AGENTS.md platform scope): Windows x64 first, macOS
        # Apple Silicon preserved. No Linux client is promised, so no Linux job competes for runner minutes.
        os: [windows-latest, macos-latest]
    # Match the signed desktop build runner. The macOS 26 pool repeatedly stalled browser and FFmpeg tests.
    runs-on: ${{ matrix.os == 'macos-latest' && 'macos-15' || matrix.os }}
    # a test that hangs ends the job, not hours later
    timeout-minutes: 45
    env:
      # the tests never start Electron: no need for its 100 MB download
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      # the pnpm version package.json names (packageManager)
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # the editor's page and the window's shell are built before the tests: several Studio tests read what the build
      # produces (studio/ui/dist), and without it they wait out their timeout instead of failing for a reason
      - run: pnpm build
      - run: pnpm --filter openfilm exec playwright-core install chromium-headless-shell
        timeout-minutes: 15
      - run: brew install ffmpeg
        if: runner.os == 'macOS'
      # Chocolatey reports success when its feed times out and nothing is installed: tried three times, then the step
      # fails if there is still no ffmpeg, instead of every test that needs it failing later
      - run: |
          for ($i = 1; $i -le 3 -and -not (Get-Command ffmpeg -ErrorAction SilentlyContinue); $i++) {
            choco install ffmpeg --no-progress -y
            if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) { Start-Sleep -Seconds (20 * $i) }
          }
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) { Write-Error 'ffmpeg did not install'; exit 1 }
          ffmpeg -version | Select-Object -First 1
        shell: pwsh
        if: runner.os == 'Windows'
      - run: pnpm test
        env:
          # what a failing test keeps to be looked at (look's two pictures of a t that differed)
          OPENFILM_TEST_ARTIFACTS: ${{ runner.temp }}/test-artifacts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-artifacts-${{ matrix.os }}
          path: ${{ runner.temp }}/test-artifacts
          if-no-files-found: ignore
          retention-days: 14

  # what npm would get: the tarball of openfilm, listed in the log and checked (no tests, fixtures or dev files; the
  # official product.json)
  pack:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:pack

  audit:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v4
        with:
          # every commit, for the secret scan of the history
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Secrets in the history
        run: gitleaks git --config .gitleaks.toml --redact --no-banner --verbose .
      - name: The public audit (the files as they are)
        run: node scripts/audit-public.mjs
