name: Fission pure Windows path policy
on:
  push:
    branches: [codex/t05-path-policy]
    paths:
      - .github/workflows/fission-path-policy.yml
      - scripts/fission-path-ci.mjs
      - scripts/fission-path-ci.test.mjs
      - workers/fission/**
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fission-path-policy-codex-t05-path-policy
  cancel-in-progress: false
jobs:
  pure-path-policy:
    if: github.repository == 'jerry-halo2026/orange' && github.event.repository.visibility == 'public' && github.ref == 'refs/heads/codex/t05-path-policy'
    runs-on: windows-2025
    timeout-minutes: 12
    env:
      ORANGE_REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
    steps:
      - name: Checkout this exact candidate without stored credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
          submodules: false
          lfs: false
      - name: Require preinstalled Node without downloads
        shell: pwsh
        run: node -e "const [a,b]=process.versions.node.split('.').map(Number); if(a<22 || (a===22 && b<18)) process.exit(1)"
      - name: Test only pure result and context validation
        shell: pwsh
        run: node --test --test-reporter=tap scripts/fission-path-ci.test.mjs
      - name: Verify preinstalled tools and run only frozen original pure path cases
        shell: pwsh
        run: node scripts/fission-path-ci.mjs
