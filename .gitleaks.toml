# gitleaks: its default rules, less the made-up values the tests use. Read by CI (`gitleaks git`) and by
# `pnpm audit:public` (`gitleaks dir`). Each allowance names the files it covers and what the values look like.
title = "orangefilm"

[extend]
useDefault = true

[[allowlists]]
description = "made-up provider keys Studio's tests set and read back, and RFC 6455's sample Sec-WebSocket-Key"
condition = "AND"
paths = ['''(^|/)packages/orangefilm/studio/server/(providers/)?[\w-]+\.test\.mjs$''']
regexTarget = "secret"
regexes = ['''0123456789|12345678|123456|abcdef1234|ABCDEFGH9876''', '''^dGhlIHNhbXBsZSBub25jZQ==$''']

[[allowlists]]
description = "the library's ids in the order of its vectors, and numbers: nothing else is in the file (the emoji keycap-… reads as a key)"
paths = ['''(^|/)packages/orangefilm/library/vectors\.json$''']

[[allowlists]]
description = "apps/api tests: one made-up internal secret and fixture-signed JWTs, never a real credential"
condition = "AND"
paths = ['''(^|/)apps/api/src/.*\.test\.ts$''']
regexTarget = "secret"
regexes = ['''fixture-internal-secret-0123456789abcdef''', '''fixture-signature''']

# The environment every installer carries (scripts/release-environment.mjs, resources/auth-environment.json). Its
# `publishableKey` is the client-side key Supabase hands to browsers: it is inside every installed app by design, and
# the build refuses a privileged key (`sb_secret_…`, a `service_role` JWT) before it can ever be written here.
[[allowlists]]
description = "the shipped client environment: environmentId, authOrigin and the public client key, nothing else"
paths = ['''(^|/)apps/desktop/release/environment\.json$''']
