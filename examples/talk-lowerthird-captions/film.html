<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1280, height=720" />
<style>
  /* nothing here places a clip: the host does, from each clip's own style (SPEC §1) */
  html, body { margin: 0; background: #000; }
</style>
</head>
<body>

<!-- V3 · the lower third, over the speaker's shoulder line, 1.0s to 5.8s -->
<section>
  <iframe
    id="name"
    src="saved/openfilm/text-hf-lt-clean-bar/hf-lt-clean-bar.html#t=0,4.8"
    at="1"
    size="760x160"
    style="left: 60px; top: 448px; width: 507px; height: 107px"
    data-props='[{"name":"Name","type":"text","at":".lt-name"},{"name":"Role","type":"text","at":".lt-role"},{"name":"Accent","type":"var","var":"--lt-accent"}]'
    overrides='[{"at":".lt-name","text":"Ada Lovelace"},{"at":".lt-role","text":"Mathematician · Writer"}]'></iframe>
</section>

<!-- V2 · the captions, word by word, along the foot of the picture, 0s to 8s -->
<section>
  <iframe
    id="words"
    src="saved/openfilm/text-hf-caption-highlight/hf-caption-highlight.html#t=0,8"
    at="0"
    size="1720x130"
    style="left: 66px; top: 596px; width: 1147px; height: 87px"
    data-props='[{"name":"Accent","type":"var","var":"--hl-accent"},{"name":"Color","type":"var","var":"--hl-color"}]'
    overrides='[{"at":"html","style":{"--hl-accent":"#ff8a00"}}]'></iframe>
</section>

<!-- V1 · the shot itself: a stand-in for the footage (replace with <video src="assets/take.mp4">) -->
<section>
  <iframe id="speaker" src="speaker.html#t=0,12" at="0" size="1280x720"
          style="left: 0; top: 0; width: 1280px; height: 720px"></iframe>
</section>

<!--
  Sound is never taken from a page: every sound in a film is a clip. Put a bed under the voice like this, and the
  voice over itself the same way, once there is a file for it:

  <section><audio src="assets/bed.m4a#t=0,12" at="0" volume="0.25"></audio></section>
  <section><audio src="assets/vo.wav#t=0,11.4" at="0.2" volume="1"></audio></section>
-->

</body>
</html>
