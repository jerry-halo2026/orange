<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1280, height=720" />
    <title>Talking head (stand-in)</title>
    <!--
      A stand-in for the footage of a talking-head shot, so this example runs offline with no media of its own:
      a studio backdrop, a slow camera drift and a head whose mouth moves. Everything is a pure function of t
      (OrangeFilm SPEC §3), so every frame is the same picture whenever it is asked for. Replace this clip with a
      real <video> in film.html and the rest of the example is unchanged.
    -->
    <style>
      html, body { margin: 0; width: 1280px; height: 720px; overflow: hidden; background: #0e1420; }
      #stage { position: absolute; inset: 0; overflow: hidden; }
      .backdrop { position: absolute; inset: -10%; background:
        radial-gradient(900px 620px at 30% 20%, #2b3b5c 0%, transparent 60%),
        radial-gradient(700px 520px at 80% 80%, #3a2b4f 0%, transparent 65%),
        linear-gradient(160deg, #101828, #0a0e16); }
      .beam { position: absolute; left: 50%; top: -30%; width: 900px; height: 1100px; margin-left: -450px;
        background: radial-gradient(closest-side, rgba(255,246,214,.16), transparent 70%);
        transform-origin: 50% 0; }
      #person { position: absolute; left: 50%; bottom: 0; width: 460px; height: 560px; margin-left: -230px;
        will-change: transform; }
      .head { position: absolute; left: 50%; top: 60px; width: 240px; height: 280px; margin-left: -120px;
        border-radius: 48% 48% 44% 44%; background: linear-gradient(170deg, #d9a98a, #b9825f 70%); }
      .hair { position: absolute; left: 50%; top: 28px; width: 266px; height: 180px; margin-left: -133px;
        border-radius: 50% 50% 40% 40%; background: #241a17; }
      .eye { position: absolute; top: 150px; width: 26px; height: 12px; border-radius: 50%; background: #241a17; }
      .eye.l { left: 78px; } .eye.r { right: 78px; }
      #mouth { position: absolute; left: 50%; top: 208px; width: 54px; height: 12px; margin-left: -27px;
        border-radius: 8px; background: #6a3128; transform-origin: 50% 0; }
      .neck { position: absolute; left: 50%; top: 320px; width: 96px; height: 70px; margin-left: -48px;
        background: linear-gradient(180deg, #b9825f, #a06f50); }
      .torso { position: absolute; left: 50%; bottom: 0; width: 460px; height: 220px; margin-left: -230px;
        border-radius: 120px 120px 0 0; background: linear-gradient(180deg, #2f4a6b, #1d2e45); }
      .mic { position: absolute; right: 96px; bottom: 60px; width: 10px; height: 120px; background: #2a2f38;
        border-radius: 5px; transform: rotate(-14deg); }
      .vignette { position: absolute; inset: 0; box-shadow: inset 0 0 220px 60px rgba(0, 0, 0, .55); }
    </style>
  </head>
  <body>
    <div id="stage">
      <div id="backdrop" class="backdrop"></div>
      <div id="beam" class="beam"></div>
      <div id="person">
        <div class="torso"></div><div class="neck"></div>
        <div class="hair"></div><div class="head"></div>
        <div class="eye l"></div><div class="eye r"></div><div id="mouth"></div>
        <div class="mic"></div>
      </div>
      <div class="vignette"></div>
    </div>
    <script>
      const DURATION = 12;
      const person = document.getElementById('person');
      const beam = document.getElementById('beam');
      const mouth = document.getElementById('mouth');
      const backdrop = document.getElementById('backdrop');
      function draw(t) {
        /* a slow camera drift and a light that breathes */
        person.style.transform = `translate(${(Math.sin(t * 0.35) * 10).toFixed(2)}px, ${(Math.sin(t * 0.5) * 4).toFixed(2)}px) scale(${(1.02 + 0.012 * Math.sin(t * 0.3)).toFixed(4)})`;
        const sway = -8 + Math.sin(t * 0.45) * 6;
        beam.style.transform = `rotate(${sway.toFixed(2)}deg)`;
        backdrop.style.transform = `translate(${(Math.sin(t * 0.2) * 14).toFixed(2)}px, ${(Math.cos(t * 0.17) * 8).toFixed(2)}px) scale(1.03)`;
        /* speaking: two rounded syllables a second, closing now and then */
        const speaking = (t % 5.2) < 4.1;
        const open = speaking ? Math.abs(Math.sin(t * Math.PI * 1.7)) : 0.08;
        mouth.style.transform = `scaleY(${(1 + open * 1.3).toFixed(3)})`;
        mouth.style.borderRadius = `${(6 + open * 8).toFixed(1)}px`;
      }
      window.film = {
        duration: DURATION,
        width: 1280,
        height: 720,
        ready: document.fonts.ready,
        frame(t) { draw(Math.max(0, t)); },
      };
      draw(0);
    </script>
  </body>
</html>
