<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1000, height=460" />
    <title>Bar chart</title>
    <!--
      A data card, after HyperFrames' `bar-chart-race`.
      OpenFilm page, rewritten from HyperFrames' registry (github.com/heygen-com/hyperframes, Apache-2.0,
      pinned v0.9.60). No CDN, no web font: the picture is a pure computation of t (SPEC §3).
    -->
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1000px; height: 460px; background: transparent; overflow: hidden;
        font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", -apple-system, Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
      :root { --b-accent: #4cc9f0; --b-ink: #ffffff; --b-muted: #8b93a7; --b-track: rgba(255,255,255,.10); --b-font: "PingFang SC", "Microsoft YaHei", "Segoe UI", -apple-system, Helvetica, Arial, sans-serif; }
      #root { position: absolute; inset: 0; display: flex; flex-direction: column; gap: 18px; padding: 14px 18px; }
      .b-title { font-size: 26px; font-weight: 700; color: var(--b-ink); letter-spacing: .01em; }
      .b-rows { display: flex; flex-direction: column; gap: 16px; flex: 1; justify-content: center; }
      .b-row { display: flex; align-items: center; gap: 14px; }
      .b-name { width: 190px; font-size: 20px; color: var(--b-muted); text-align: right; }
      .b-track { flex: 1; height: 40px; background: var(--b-track); border-radius: 8px; overflow: hidden; }
      .b-fill { height: 100%; width: 0%; background: var(--b-accent); border-radius: 8px; }
      .b-val { width: 92px; font-size: 21px; font-weight: 700; color: var(--b-ink); }
    </style>
  </head>
  <body>
    <div id="root"><div class="b-title">Time to first render</div>
      <div class="b-rows">
        <div class="b-row"><div class="b-name">Old way</div><div class="b-track"><div class="b-fill" data-v="96"></div></div><div class="b-val">4.8s</div></div>
        <div class="b-row"><div class="b-name">Bundled</div><div class="b-track"><div class="b-fill" data-v="64"></div></div><div class="b-val">3.1s</div></div>
        <div class="b-row"><div class="b-name">A page</div><div class="b-track"><div class="b-fill" data-v="18"></div></div><div class="b-val">0.4s</div></div>
      </div>
    </div>
    <script>
      const clamp = (x) => Math.min(1, Math.max(0, x));
      const at = (t, start, secs) => clamp((t - start) / secs);
      const out2 = (x) => 1 - Math.pow(1 - x, 2);
      const out3 = (x) => 1 - Math.pow(1 - x, 3);
      const in2 = (x) => x * x;
      const lerp = (a, b, k) => a + (b - a) * k;
      const BARS = [[96, '4.8s'], [64, '3.1s'], [18, '0.4s']];
      const fills = [...document.querySelectorAll('.b-fill')];
      const vals = [...document.querySelectorAll('.b-val')];
      function draw(t) {
        fills.forEach((el, i) => {
          const k = out3(at(t, 0.2 + i * 0.35, 0.9));
          el.style.width = `${(BARS[i][0] * k).toFixed(2)}%`;
          vals[i].style.opacity = String(out2(at(t, 0.2 + i * 0.35, 0.5)));
          vals[i].textContent = BARS[i][1];
        });
      }
      const DURATION = 5;

      window.film = {
        duration: DURATION,
        width: 1000,
        height: 460,
        ready: document.fonts.ready,
        frame(t) { draw(Math.max(0, t)); },
      };
      draw(0);
    </script>
  </body>
</html>
