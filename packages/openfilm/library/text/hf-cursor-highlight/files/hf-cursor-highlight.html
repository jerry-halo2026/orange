<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=900, height=520" />
    <title>Cursor, highlight</title>
    <!--
      A cursor card, after HyperFrames' `cursor-highlight`.
      OpenFilm page, rewritten from HyperFrames' registry (github.com/heygen-com/hyperframes, Apache-2.0,
      pinned v0.9.60). No CDN, no web font: the picture is a pure computation of t (SPEC §3).
    -->
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 900px; height: 520px; background: transparent; overflow: hidden;
        font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", -apple-system, Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
      :root { --cu-accent: #ffd166; --cu-font: "PingFang SC", "Microsoft YaHei", "Segoe UI", -apple-system, Helvetica, Arial, sans-serif; }
      #root { position: absolute; inset: 0; }
      .panel { position: absolute; left: 220px; top: 140px; width: 460px; height: 240px; border-radius: 18px;
               background: rgba(255,255,255,.10); border: 1px solid rgba(255,255,255,.16); }
      #hl { position: absolute; left: 208px; top: 128px; width: 484px; height: 264px; border-radius: 22px;
            border: 3px solid var(--cu-accent); box-shadow: 0 0 0 6px rgba(255,209,102,.16); opacity: 0; }
      .hl-label { position: absolute; left: 208px; top: 84px; padding: 8px 14px; border-radius: 999px;
                  background: var(--cu-accent); color: #241a00; font-size: 16px; font-weight: 700;
                  opacity: 0; white-space: nowrap; }
      #cursor { position: absolute; left: 0; top: 0; will-change: transform; }
      .cur-dot { width: 22px; height: 22px; margin: -11px 0 0 -11px; border-radius: 50%;
                 background: #fff; box-shadow: 0 0 0 3px var(--cu-accent), 0 6px 16px rgba(0,0,0,.45); }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="panel"></div>
      <div id="hl"></div>
      <div class="hl-label">this panel</div>
      <div id="cursor"><div class="cur-dot"></div></div>
    </div>
    <script>
      const clamp = (x) => Math.min(1, Math.max(0, x));
      const at = (t, start, secs) => clamp((t - start) / secs);
      const out2 = (x) => 1 - Math.pow(1 - x, 2);
      const out3 = (x) => 1 - Math.pow(1 - x, 3);
      const in2 = (x) => x * x;
      const lerp = (a, b, k) => a + (b - a) * k;
      const cur = document.getElementById('cursor');
      const wrap = document.getElementById('cursor-wrap');
      const PATH = [[120, 420], [300, 320], [430, 260]];
      function place(el, x, y) { el.style.transform = `translate(${x.toFixed(1)}px, ${y.toFixed(1)}px)`; }
      function pathAt(k) {
        const n = PATH.length - 1;
        const i = Math.min(n - 1, Math.floor(k * n));
        const f = k * n - i;
        const a = PATH[i], b = PATH[i + 1];
        return [lerp(a[0], b[0], f), lerp(a[1], b[1], f)];
      }
      const hl = document.getElementById('hl');
      const label = document.querySelector('.hl-label');
      function draw(t) {
        const k = out3(at(t, 0.15, 1.3));
        const [x, y] = pathAt(k);
        place(cur, x, y);
        const p = out2(at(t, 1.5, 0.5));
        hl.style.opacity = String(p);
        hl.style.transform = `scale(${(0.94 + 0.06 * p).toFixed(3)})`;
        label.style.opacity = String(out2(at(t, 1.8, 0.4)));
      }
      const DURATION = 4;

      window.film = {
        duration: DURATION,
        width: 900,
        height: 520,
        ready: document.fonts.ready,
        frame(t) { draw(Math.max(0, t)); },
      };
      draw(0);
    </script>
  </body>
</html>
