<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=860, height=150" />
    <title>Lower third, mask reveal</title>
    <!--
      A lower third, after HyperFrames' block `lt-mask-reveal`.
      OpenFilm page, rewritten from HyperFrames' registry (github.com/heygen-com/hyperframes, Apache-2.0,
      pinned v0.9.60). No CDN, no web font: the picture is a pure computation of t (SPEC §3).
    -->
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 860px; height: 150px; background: transparent; overflow: hidden; }
      :root { --lt-font: "PingFang SC", "Microsoft YaHei", "Segoe UI", -apple-system, Helvetica, Arial, sans-serif; --lt-accent: #4de1c1; --lt-ink: #ffffff; }
      #root { position: absolute; inset: 0; display: flex; align-items: flex-end; padding: 0 6px 6px; }
      .lt { font-family: var(--lt-font); display: flex; flex-direction: column; gap: 8px; }
      .lt-line { overflow: hidden; }
      .lt-name { font-size: 60px; font-weight: 700; color: var(--lt-ink); line-height: 1.05; letter-spacing: -0.02em; white-space: nowrap; text-shadow: 0 6px 24px rgba(0,0,0,.55); will-change: clip-path, transform; }
      .lt-role { font-size: 24px; font-weight: 500; color: var(--lt-ink); opacity: .82; line-height: 1.2; white-space: nowrap; will-change: clip-path, transform; }
      .lt-rule { height: 4px; width: 100%; background: var(--lt-accent); transform-origin: 0 50%; }
    </style>
  </head>
  <body>
    <div id="root"><div id="card" class="lt">
      <div class="lt-line"><div id="name" class="lt-name">Ada Lovelace</div></div>
      <div class="lt-line"><div id="role" class="lt-role">Mathematician · Writer</div></div>
      <div id="rule" class="lt-rule"></div>
    </div></div>

    <script>
      const DURATION = 4.8;
      const card = document.getElementById('card');
      const clamp = (x) => Math.min(1, Math.max(0, x));
      const at = (t, start, secs) => clamp((t - start) / secs);
      const out3 = (x) => 1 - Math.pow(1 - x, 3);
      const out2 = (x) => 1 - Math.pow(1 - x, 2);
      const in2 = (x) => x * x;
      const name = document.getElementById('name');
      const role = document.getElementById('role');
      const rule = document.getElementById('rule');
      function inside(t) {
        const n = out3(at(t, 0.08, 0.55));
        name.style.clipPath = `inset(0 ${((1 - n) * 100).toFixed(3)}% 0 0)`;
        name.style.transform = `translateY(${(30 * (1 - n)).toFixed(2)}px)`;
        const r = out3(at(t, 0.22, 0.55));
        role.style.clipPath = `inset(0 ${((1 - r) * 100).toFixed(3)}% 0 0)`;
        role.style.transform = `translateY(${(24 * (1 - r)).toFixed(2)}px)`;
        rule.style.transform = `scaleX(${out2(at(t, 0.34, 0.5)).toFixed(4)})`;
      }
      function draw(t) {
        const out = in2(at(t, 4.3, 0.35));
        card.style.opacity = String(1 - out);
        card.style.transform = `translateY(${(18 * out).toFixed(2)}px)`;
        card.style.visibility = t >= 4.75 ? 'hidden' : 'visible';
        inside(t);
      }
      window.film = {
        duration: DURATION,
        width: 860,
        height: 150,
        ready: document.fonts.ready,
        frame(t) { draw(Math.max(0, t)); },
      };
      draw(0);
    </script>
  </body>
</html>
