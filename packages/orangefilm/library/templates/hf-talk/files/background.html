<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Mesh gradient</title>
    <!--
      An animated mesh gradient, after the family of HyperFrames' background blocks (github.com/heygen-com/hyperframes,
      Apache-2.0, pinned v0.9.60): rewritten here in CSS alone, since their WebGPU blocks need a GPU adapter our host
      does not have. The picture is a pure computation of t (SPEC §3).
    -->
    <style>
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #05060a; }
      :root { --g1: #3b2dff; --g2: #ff2d93; --g3: #00d0ff; --g4: #ffd166; --base: #05060a; }
      #bg { position: absolute; inset: -10%; filter: blur(60px) saturate(120%); }
      #bg i { position: absolute; display: block; border-radius: 50%; mix-blend-mode: screen; opacity: .85; }
      #grain { position: absolute; inset: 0; opacity: .06;
        background-image: radial-gradient(rgba(255,255,255,.9) 1px, transparent 1px);
        background-size: 3px 3px; }
    </style>
  </head>
  <body>
    <div id="bg">
      <i id="b1"></i><i id="b2"></i><i id="b3"></i><i id="b4"></i>
    </div>
    <div id="grain"></div>
    <script>
      const blobs = [
        { el: document.getElementById('b1'), c: 'var(--g1)', r: 0.55, kx: 0.31, ky: 0.23, cx: 0.28, cy: 0.30 },
        { el: document.getElementById('b2'), c: 'var(--g2)', r: 0.48, kx: -0.24, ky: 0.37, cx: 0.72, cy: 0.36 },
        { el: document.getElementById('b3'), c: 'var(--g3)', r: 0.42, kx: 0.19, ky: -0.29, cx: 0.62, cy: 0.74 },
        { el: document.getElementById('b4'), c: 'var(--g4)', r: 0.36, kx: -0.33, ky: -0.18, cx: 0.34, cy: 0.72 },
      ];
      for (const b of blobs) b.el.style.background = `radial-gradient(circle at 50% 50%, ${b.c} 0%, transparent 70%)`;
      function draw(t) {
        for (const b of blobs) {
          const size = b.r * 1920 * 2;
          const x = (b.cx + Math.sin(t * b.kx) * 0.10) * 1920;
          const y = (b.cy + Math.cos(t * b.ky) * 0.10) * 1080;
          b.el.style.width = b.el.style.height = `${size.toFixed(1)}px`;
          b.el.style.left = `${(x - size / 2).toFixed(1)}px`;
          b.el.style.top = `${(y - size / 2).toFixed(1)}px`;
          b.el.style.opacity = String(0.72 + 0.18 * Math.sin(t * 0.7 + b.cx * 6));
        }
      }
      window.film = {
        duration: 8, width: 1920, height: 1080, ready: document.fonts.ready,
        frame(t) { draw(Math.max(0, t)); },
      };
      draw(0);
    </script>
  </body>
</html>
