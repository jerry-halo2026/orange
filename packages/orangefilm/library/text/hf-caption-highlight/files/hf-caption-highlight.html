<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1720, height=130" />
    <title>Caption highlight</title>
    <!--
      OrangeFilm page: word-by-word caption with a red sweep behind each active word, after HyperFrames'
      component `caption-highlight` (github.com/heygen-com/hyperframes, Apache-2.0, pinned v0.9.60).
      Rewritten for OrangeFilm: the page is its own box (1720 x 130, placed by the host), no CDN GSAP and
      no web font (offline, deterministic), the footage background is gone (the film shows through this
      overlay), and the colours are the clip's `data-props`. The timeline is a pure `frame(t)`
      computation (SPEC §3).
    -->
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      html, body { width: 1720px; height: 130px; margin: 0; overflow: hidden; background: transparent; }
      :root {
        --hl-color: #ffffff;
        --hl-accent: #ff1745;
        --hl-accent-2: #df1238;
        --hl-font: "PingFang SC", "Microsoft YaHei", "Segoe UI", -apple-system, Helvetica, Arial, sans-serif;
        --hl-weight: 800;
      }
      #highlight { position: relative; width: 1720px; height: 130px; overflow: hidden; background: transparent; pointer-events: none; }
      #hl-container { position: absolute; inset: 0; pointer-events: none; }
      .hl-group {
        position: absolute; bottom: 0; left: 0; width: 100%;
        display: flex; flex-wrap: nowrap; align-items: flex-end; justify-content: center;
        gap: 8px; padding: 0 10px;
        opacity: 0; visibility: hidden;
        will-change: opacity;
      }
      .hl-word {
        font-family: var(--hl-font);
        font-weight: var(--hl-weight);
        font-size: 80px;
        text-transform: uppercase;
        color: var(--hl-color);
        display: inline-block;
        letter-spacing: 0.02em;
        line-height: 1;
        position: relative;
        padding: 6px 12px 8px;
        text-shadow: 0 6px 18px rgba(0, 0, 0, 0.45);
        transform-origin: 50% 58%;
        white-space: nowrap;
        will-change: transform, filter;
      }
      .hl-word-bg {
        position: absolute; inset: 0;
        background: linear-gradient(135deg, var(--hl-accent) 0%, var(--hl-accent-2) 100%);
        border-radius: 10px;
        box-shadow: 0 12px 30px rgba(229, 20, 58, 0.32);
        opacity: 0;
        transform: scaleX(0);
        transform-origin: 0% 50%;
        z-index: -1;
        will-change: transform, opacity;
      }
      .hl-word-text { position: relative; z-index: 1; }
    </style>
  </head>
  <body>
    <div id="highlight">
      <div id="hl-container"></div>
    </div>

    <script>
      const DURATION = 8;

      /* the words and when they are said: the line this caption is made for */
      const WORDS = [
        ['Every', 0.0, 0.3], ['great', 0.3, 0.55], ['video', 0.55, 0.85], ['starts', 0.85, 1.1],
        ['with', 1.1, 1.25], ['a', 1.25, 1.35], ['single', 1.35, 1.65], ['frame.', 1.65, 2.0],
        ['OrangeFilm', 2.1, 2.65], ['lets', 2.65, 2.85], ['you', 2.85, 2.95], ['write', 2.95, 3.15],
        ['HTML', 3.15, 3.55], ['and', 3.55, 3.65], ['render', 3.65, 3.95], ['professional', 3.95, 4.45],
        ['video.', 4.45, 4.8],
        ['No', 4.9, 5.05], ['timeline.', 5.05, 5.45], ['No', 5.5, 5.65],
        ['drag', 5.65, 5.85], ['and', 5.85, 5.95], ['drop.', 5.95, 6.25],
        ['Just', 6.35, 6.55], ['code', 6.55, 6.8], ['that', 6.8, 6.95], ['becomes', 6.95, 7.3], ['cinema.', 7.3, 7.7],
      ].map(([text, start, end]) => ({ text, start, end }));

      /* a group is the words shown on one line together */
      const RAW_GROUPS = [[0, 3], [4, 7], [8, 8], [9, 12], [13, 15], [16, 16], [17, 19], [20, 22], [23, 24], [25, 27]];

      const container = document.getElementById('hl-container');
      const groups = [];

      /* the largest size the line fits in, measured once (no wall clock, no network) */
      const measure = document.createElement('canvas').getContext('2d');
      const fontFamily = getComputedStyle(document.documentElement).getPropertyValue('--hl-font').trim() || 'sans-serif';
      const weight = getComputedStyle(document.documentElement).getPropertyValue('--hl-weight').trim() || '800';
      const fitFontSize = (text, base, maxWidth) => {
        let size = base;
        const min = Math.floor(base * 0.45);
        while (size > min) {
          measure.font = `${weight} ${size}px ${fontFamily}`;
          if (measure.measureText(text).width <= maxWidth) return size;
          size -= 2;
        }
        return min;
      };

      RAW_GROUPS.forEach(([wordStart, wordEnd], gi) => {
        const nextStart = gi + 1 < RAW_GROUPS.length ? WORDS[RAW_GROUPS[gi + 1][0]].start : Infinity;
        const end = Math.min(WORDS[wordEnd].end + 0.5, nextStart - 0.05);
        const words = WORDS.slice(wordStart, wordEnd + 1);

        const groupEl = document.createElement('div');
        groupEl.className = 'hl-group';
        const size = fitFontSize(words.map((w) => w.text.toUpperCase()).join(' '), 80, 1700);

        const wordEls = words.map((w, i) => {
          const wordEl = document.createElement('span');
          wordEl.className = 'hl-word';
          wordEl.style.fontSize = `${size}px`;
          const bgEl = document.createElement('span');
          bgEl.className = 'hl-word-bg';
          const textEl = document.createElement('span');
          textEl.className = 'hl-word-text';
          textEl.textContent = w.text.toUpperCase();
          wordEl.append(bgEl, textEl);
          groupEl.appendChild(wordEl);
          return { wordEl, bgEl, start: WORDS[wordStart + i].start, end: WORDS[wordStart + i].end };
        });

        container.appendChild(groupEl);
        groups.push({ el: groupEl, start: WORDS[wordStart].start, end, words: wordEls });
      });

      const clamp01 = (x) => Math.min(1, Math.max(0, x));
      const out2 = (x) => 1 - Math.pow(1 - x, 2);
      const in2 = (x) => x * x;
      const at = (t, start, secs) => clamp01((t - start) / secs);

      function draw(t) {
        for (const g of groups) {
          const shown = t >= g.start && t < g.end;
          g.el.style.visibility = shown ? 'visible' : 'hidden';
          if (!shown) { g.el.style.opacity = '0'; continue; }
          const inP = out2(at(t, g.start, 0.12));
          const outP = in2(at(t, g.end - 0.1, 0.1));
          g.el.style.opacity = String(Math.min(inP, 1 - outP));

          for (const w of g.words) {
            const live = t >= w.start && t < w.end;
            const bgIn = out2(at(t, w.start, Math.min(0.15, w.end - w.start)));
            const bgOut = in2(at(t, w.end, 0.1));
            const sweep = live ? bgIn : (t >= w.end ? 1 : 0);
            w.bgEl.style.opacity = String(live ? Math.min(bgIn, 1) : Math.max(0, 1 - bgOut) * (sweep ? 1 : 0));
            w.bgEl.style.transform = `scaleX(${(live ? sweep : 0).toFixed(4)})`;
            const pop = live ? 1 + 0.05 * Math.sin(Math.PI * Math.min(1, (t - w.start) / Math.max(0.08, w.end - w.start))) : 1;
            w.wordEl.style.filter = `brightness(${pop.toFixed(3)})`;
          }
        }
      }

      window.film = {
        duration: DURATION,
        width: 1720,
        height: 130,
        ready: document.fonts.ready,
        frame(t) { draw(Math.max(0, t)); },
      };
      draw(0);
    </script>
  </body>
</html>
