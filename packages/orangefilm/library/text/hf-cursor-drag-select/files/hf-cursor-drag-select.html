<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=900, height=520" />
    <title>Cursor, drag select</title>
    <!--
      A cursor card, after HyperFrames' `cursor-drag-select`.
      OrangeFilm page, rewritten from HyperFrames' registry (github.com/heygen-com/hyperframes, Apache-2.0,
      pinned v0.9.60). No CDN, no web font: the picture is a pure computation of t (SPEC §3).
    -->
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 900px; height: 520px; background: transparent; overflow: hidden;
        font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", -apple-system, Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
      :root { --cu-accent: #7cf3c0; --cu-font: "PingFang SC", "Microsoft YaHei", "Segoe UI", -apple-system, Helvetica, Arial, sans-serif; }
      #root { position: absolute; inset: 0; }
      .items { position: absolute; inset: 90px 80px auto 80px; display: grid;
               grid-template-columns: repeat(3, 1fr); gap: 22px; }
      .item { height: 150px; border-radius: 14px; background: rgba(255,255,255,.10); border: 1px solid rgba(255,255,255,.14); }
      #box { position: absolute; border: 2px dashed var(--cu-accent); background: rgba(124,243,192,.14); opacity: 0; }
      #cursor { position: absolute; left: 0; top: 0; will-change: transform; }
      .cur-dot { width: 22px; height: 22px; margin: -11px 0 0 -11px; border-radius: 50%;
                 background: var(--cu-accent); box-shadow: 0 4px 14px rgba(0,0,0,.45); }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="items"><div class="item"></div><div class="item"></div><div class="item"></div></div>
      <div id="box"></div>
      <div id="cursor"><div class="cur-dot"></div></div>
    </div>
    <script>
      const clamp = (x) => Math.min(1, Math.max(0, x));
      const at = (t, start, secs) => clamp((t - start) / secs);
      const out2 = (x) => 1 - Math.pow(1 - x, 2);
      const out3 = (x) => 1 - Math.pow(1 - x, 3);
      const in2 = (x) => x * x;
      const lerp = (a, b, k) => a + (b - a) * k;
      const cur = document.getElementById('cursor');
      const wrap = document.getElementById('cursor-wrap');
      const PATH = [[96, 300], [120, 110], [140, 80]];
      function place(el, x, y) { el.style.transform = `translate(${x.toFixed(1)}px, ${y.toFixed(1)}px)`; }
      function pathAt(k) {
        const n = PATH.length - 1;
        const i = Math.min(n - 1, Math.floor(k * n));
        const f = k * n - i;
        const a = PATH[i], b = PATH[i + 1];
        return [lerp(a[0], b[0], f), lerp(a[1], b[1], f)];
      }
      const box = document.getElementById('box');
      function draw(t) {
        const k = out3(at(t, 0.2, 1.2));
        const [x, y] = pathAt(k);
        place(cur, x, y);
        const grow = out2(at(t, 0.9, 1.1));
        const w = lerp(0, 700, grow);
        const h = lerp(0, 200, grow);
        box.style.left = '96px'; box.style.top = '96px';
        box.style.width = `${w.toFixed(1)}px`; box.style.height = `${h.toFixed(1)}px`;
        box.style.opacity = String(t >= 0.9 && t < 3.4 ? 1 : (t >= 3.4 ? Math.max(0, 1 - at(t, 3.4, 0.3)) : 0));
      }
      const DURATION = 4;

      window.film = {
        duration: DURATION,
        width: 900,
        height: 520,
        ready: document.fonts.ready,
        frame(t) { draw(Math.max(0, t)); },
      };
      draw(0);
    </script>
  </body>
</html>
