<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=640, height=260" />
    <title>Number wheel</title>
    <!--
      A data card, after HyperFrames' `number-wheel`.
      OpenFilm page, rewritten from HyperFrames' registry (github.com/heygen-com/hyperframes, Apache-2.0,
      pinned v0.9.60). No CDN, no web font: the picture is a pure computation of t (SPEC §3).
    -->
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 640px; height: 260px; background: transparent; overflow: hidden;
        font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", -apple-system, Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
      :root { --n-accent: #ffd166; --n-ink: #ffffff; --n-muted: #8b93a7; --n-font: "PingFang SC", "Microsoft YaHei", "Segoe UI", -apple-system, Helvetica, Arial, sans-serif; }
      #root { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; }
      .n-num { display: flex; gap: 6px; font-variant-numeric: tabular-nums; }
      .n-digit { width: 0.72em; height: 1.15em; overflow: hidden; text-align: center;
                 font-size: 108px; font-weight: 800; color: var(--n-ink); line-height: 1.15; }
      .n-strip { display: flex; flex-direction: column; will-change: transform; }
      .n-strip span { height: 1.15em; line-height: 1.15; }
      .n-label { font-size: 20px; letter-spacing: .16em; text-transform: uppercase; color: var(--n-muted); }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="num" class="n-num"></div>
      <div class="n-label">films made as pages</div>
    </div>
    <script>
      const clamp = (x) => Math.min(1, Math.max(0, x));
      const at = (t, start, secs) => clamp((t - start) / secs);
      const out2 = (x) => 1 - Math.pow(1 - x, 2);
      const out3 = (x) => 1 - Math.pow(1 - x, 3);
      const in2 = (x) => x * x;
      const lerp = (a, b, k) => a + (b - a) * k;
      const TARGET = '20481';
      const num = document.getElementById('num');
      const digits = [...TARGET].map((d) => {
        const box = document.createElement('div');
        box.className = 'n-digit';
        const strip = document.createElement('div');
        strip.className = 'n-strip';
        for (let i = 0; i <= 9; i++) { const s = document.createElement('span'); s.textContent = String(i); strip.appendChild(s); }
        box.appendChild(strip);
        num.appendChild(box);
        return { strip, value: Number(d) };
      });
      const H = 1.15;
      function draw(t) {
        digits.forEach((d, i) => {
          const k = out3(at(t, 0.3 + i * 0.12, 1.1));
          const turns = 1 + i * 0.2;
          const pos = (d.value + 10 * turns) * (1 - k) + d.value * k;
          d.strip.style.transform = `translateY(${(-(pos - d.value) * H).toFixed(3)}em)`;
        });
      }
      const DURATION = 4;

      window.film = {
        duration: DURATION,
        width: 640,
        height: 260,
        ready: document.fonts.ready,
        frame(t) { draw(Math.max(0, t)); },
      };
      draw(0);
    </script>
  </body>
</html>
