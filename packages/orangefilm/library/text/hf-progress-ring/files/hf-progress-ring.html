<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=480, height=480" />
    <title>Progress ring</title>
    <!--
      A data card, after HyperFrames' `progress-ring`.
      OpenFilm page, rewritten from HyperFrames' registry (github.com/heygen-com/hyperframes, Apache-2.0,
      pinned v0.9.60). No CDN, no web font: the picture is a pure computation of t (SPEC §3).
    -->
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 480px; height: 480px; background: transparent; overflow: hidden;
        font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", -apple-system, Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
      :root { --r-accent: #8b5cf6; --r-ink: #ffffff; --r-muted: #8b93a7; --r-track: rgba(255,255,255,.12); --r-font: "PingFang SC", "Microsoft YaHei", "Segoe UI", -apple-system, Helvetica, Arial, sans-serif; }
      #root { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
      .r-ring { width: 380px; height: 380px; border-radius: 50%; background: conic-gradient(var(--r-accent) 0deg, var(--r-track) 0deg);
                display: flex; align-items: center; justify-content: center; position: relative; }
      .r-hole { width: 296px; height: 296px; border-radius: 50%; background: rgba(16,18,24,.86);
                display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; }
      .r-pct { font-size: 84px; font-weight: 800; color: var(--r-ink); font-variant-numeric: tabular-nums; }
      .r-label { font-size: 17px; letter-spacing: .14em; text-transform: uppercase; color: var(--r-muted); }
    </style>
  </head>
  <body>
    <div id="root"><div id="ring" class="r-ring"><div class="r-hole">
      <div id="pct" class="r-pct">0%</div>
      <div class="r-label">delivered</div>
    </div></div></div>
    <script>
      const clamp = (x) => Math.min(1, Math.max(0, x));
      const at = (t, start, secs) => clamp((t - start) / secs);
      const out2 = (x) => 1 - Math.pow(1 - x, 2);
      const out3 = (x) => 1 - Math.pow(1 - x, 3);
      const in2 = (x) => x * x;
      const lerp = (a, b, k) => a + (b - a) * k;
      const ring = document.getElementById('ring');
      const pct = document.getElementById('pct');
      const SHARE = 0.78;
      function draw(t) {
        const k = out3(at(t, 0.25, 1.6));
        const deg = 360 * SHARE * k;
        ring.style.background = `conic-gradient(var(--r-accent) ${deg.toFixed(1)}deg, var(--r-track) ${deg.toFixed(1)}deg)`;
        pct.textContent = `${Math.round(78 * k)}%`;
      }
      const DURATION = 4;

      window.film = {
        duration: DURATION,
        width: 480,
        height: 480,
        ready: document.fonts.ready,
        frame(t) { draw(Math.max(0, t)); },
      };
      draw(0);
    </script>
  </body>
</html>
