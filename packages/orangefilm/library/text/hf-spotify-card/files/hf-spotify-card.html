<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=660, height=200" />
    <title>Now playing card</title>
    <!--
      A social card, after HyperFrames' `spotify-card`.
      OrangeFilm page, rewritten from HyperFrames' registry (github.com/heygen-com/hyperframes, Apache-2.0,
      pinned v0.9.60). No CDN, no web font: the picture is a pure computation of t (SPEC §3).
    -->
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 660px; height: 200px; background: transparent; overflow: hidden;
        font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", -apple-system, Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
      :root { --s-accent: #1db954; --s-ink: #ffffff; --s-card: #181818; --s-muted: #a7a7a7; --s-font: "PingFang SC", "Microsoft YaHei", "Segoe UI", -apple-system, Helvetica, Arial, sans-serif; }
      #root { position: absolute; inset: 0; display: flex; align-items: center; }
      .s-card { width: 640px; background: var(--s-card); border-radius: 16px; padding: 16px;
                display: flex; gap: 16px; align-items: center; box-shadow: 0 20px 48px rgba(0,0,0,.5);
                will-change: transform, opacity; }
      .s-art { width: 132px; height: 132px; border-radius: 10px; flex-shrink: 0;
               background: linear-gradient(150deg, var(--s-accent), #0f6b32 70%); }
      .s-main { display: flex; flex-direction: column; gap: 6px; flex: 1; }
      .s-track { font-size: 24px; font-weight: 700; color: var(--s-ink); }
      .s-artist { font-size: 18px; color: var(--s-muted); }
      .s-bar { height: 5px; border-radius: 3px; background: rgba(255,255,255,.18); overflow: hidden; margin-top: 8px; }
      .s-fill { height: 100%; width: 0%; background: var(--s-accent); border-radius: 3px; }
    </style>
  </head>
  <body>
    <div id="root"><div id="card" class="s-card">
      <div class="s-art"></div>
      <div class="s-main">
        <div class="s-track">Every Frame</div>
        <div class="s-artist">OrangeFilm</div>
        <div class="s-bar"><div id="fill" class="s-fill"></div></div>
      </div>
    </div></div>
    <script>
      const clamp = (x) => Math.min(1, Math.max(0, x));
      const at = (t, start, secs) => clamp((t - start) / secs);
      const out2 = (x) => 1 - Math.pow(1 - x, 2);
      const out3 = (x) => 1 - Math.pow(1 - x, 3);
      const in2 = (x) => x * x;
      const lerp = (a, b, k) => a + (b - a) * k;
      const card = document.getElementById('card');
      const fill = document.getElementById('fill');
      function draw(t) {
        const p = out3(at(t, 0.12, 0.5));
        card.style.transform = `translateY(${(18 * (1 - p)).toFixed(2)}px)`;
        card.style.opacity = String(p);
        fill.style.width = `${(clamp((t - 0.5) / 4).toFixed(3) * 100).toFixed(2)}%`;
      }
      const DURATION = 5;

      window.film = {
        duration: DURATION,
        width: 660,
        height: 200,
        ready: document.fonts.ready,
        frame(t) { draw(Math.max(0, t)); },
      };
      draw(0);
    </script>
  </body>
</html>
