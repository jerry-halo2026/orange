<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=760, height=320" />
    <title>Post card, X</title>
    <!--
      A social card, after HyperFrames' `x-post`.
      OrangeFilm page, rewritten from HyperFrames' registry (github.com/heygen-com/hyperframes, Apache-2.0,
      pinned v0.9.60). No CDN, no web font: the picture is a pure computation of t (SPEC §3).
    -->
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 760px; height: 320px; background: transparent; overflow: hidden;
        font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", -apple-system, Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
      :root { --x-accent: #1d9bf0; --x-ink: #0f1419; --x-card: #ffffff; --x-muted: #536471; --x-font: "PingFang SC", "Microsoft YaHei", "Segoe UI", -apple-system, Helvetica, Arial, sans-serif; }
      #root { position: absolute; inset: 0; display: flex; align-items: center; }
      .x-card { width: 720px; background: var(--x-card); border-radius: 20px; padding: 22px 24px;
                box-shadow: 0 24px 60px rgba(0,0,0,.45); display: flex; gap: 16px;
                will-change: transform, opacity; }
      .x-avatar { width: 56px; height: 56px; border-radius: 50%; flex-shrink: 0;
                  background: linear-gradient(140deg, var(--x-accent), #8b5cf6); }
      .x-main { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
      .x-head { display: flex; align-items: baseline; gap: 8px; }
      .x-name { font-size: 21px; font-weight: 700; color: var(--x-ink); }
      .x-handle { font-size: 19px; color: var(--x-muted); }
      .x-text { font-size: 23px; line-height: 1.35; color: var(--x-ink); }
      .x-foot { display: flex; gap: 26px; font-size: 17px; color: var(--x-muted); margin-top: 2px; }
    </style>
  </head>
  <body>
    <div id="root"><div id="card" class="x-card">
      <div class="x-avatar"></div>
      <div class="x-main">
        <div class="x-head"><span class="x-name">Ada Lovelace</span><span class="x-handle">@ada · 2h</span></div>
        <div class="x-text">A film is a function of time.</div>
        <div class="x-foot"><span>128 replies</span><span>2,341 reposts</span><span>18.2K likes</span></div>
      </div>
    </div></div>
    <script>
      const clamp = (x) => Math.min(1, Math.max(0, x));
      const at = (t, start, secs) => clamp((t - start) / secs);
      const out2 = (x) => 1 - Math.pow(1 - x, 2);
      const out3 = (x) => 1 - Math.pow(1 - x, 3);
      const in2 = (x) => x * x;
      const lerp = (a, b, k) => a + (b - a) * k;
      const card = document.getElementById('card');
      const parts = [...card.querySelectorAll('.x-head, .x-text, .x-foot')];
      function draw(t) {
        const p = out3(at(t, 0.1, 0.5));
        card.style.transform = `translateY(${(26 * (1 - p)).toFixed(2)}px)`;
        card.style.opacity = String(p);
        parts.forEach((el, i) => {
          const k = out2(at(t, 0.28 + i * 0.1, 0.4));
          el.style.opacity = String(k);
          el.style.transform = `translateY(${(10 * (1 - k)).toFixed(2)}px)`;
        });
      }
      const DURATION = 5;
      /* a card, not a timeline: every part fades up in turn */
      window.film = {
        duration: DURATION,
        width: 760,
        height: 320,
        ready: document.fonts.ready,
        frame(t) { draw(Math.max(0, t)); },
      };
      draw(0);
    </script>
  </body>
</html>
